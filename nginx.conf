server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Content-Security-Policy della UI: script e stili solo dalla stessa origine, API e Keycloak
    # (https) per le chiamate di rete. Gli altri header di sicurezza li aggiunge Traefik.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.roger08.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;

    # auth-config.json lo genera il chart a runtime: mai in cache
    location = /auth-config.json {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'none'" always;
        try_files $uri =404;
    }

    # Service worker e manifest: mai in cache, così gli aggiornamenti arrivano subito
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # SPA: le rotte del client ricadono su index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.roger08.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Asset con hash nel nome (Vite): cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
